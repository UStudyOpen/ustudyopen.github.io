name: Validate portal
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14.8'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.21.0'
      - name: Install pinned legal validator
        run: python3 -m pip install -r tests/requirements-licensing.txt
      - name: Validate workflow syntax
        run: |
          python3 tests/install_actionlint.py
          artifacts/tools/actionlint -shellcheck= .github/workflows/*.yml
      - name: Validate licensing, SPDX and incremental REUSE scope
        run: python3 tests/licensing.py --reuse
      - name: Install verified Quarto 1.10.18
        run: python3 tests/install_quarto.py
      - name: Validate metadata and source integrity
        run: python3 tests/validate.py --source-only
      - name: Build from an isolated source copy
        run: python3 tests/render_clean.py
      - name: Catalog regression checks
        run: python3 tests/test_catalog.py
      - name: Verify pinned course sources and public links
        run: python3 tools/catalog.py --verify-sources
      - name: Browser, keyboard, responsive and WCAG checks
        run: python3 tests/browser_portal.py
      - name: Validate publishable HTML, resources and routes
        run: python3 tests/validate.py
      - name: Retain validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: validation-evidence
          path: artifacts/
          if-no-files-found: warn
          retention-days: 7
